<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaza, vracím se 1.12.</title>
<style>
:root{--bg:#0b0b14;--bg2:#1a1030;--fg:#f5f3ff;--muted:#a79fc2;--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.14);--a:#ff3d81;--b:#7c5cff;--c:#27e1c1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2ff;--bg2:#ffe3ef;--fg:#1a1030;--muted:#6a6286;--glass:rgba(255,255,255,.7);--gb:rgba(26,16,48,.12)}}
:root[data-theme="light"]{--bg:#f6f2ff;--bg2:#ffe3ef;--fg:#1a1030;--muted:#6a6286;--glass:rgba(255,255,255,.7);--gb:rgba(26,16,48,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(900px 500px at 85% -5%,color-mix(in srgb,var(--b) 45%,transparent),transparent),radial-gradient(700px 500px at 0% 30%,color-mix(in srgb,var(--a) 35%,transparent),transparent),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{height:100%;max-width:480px;margin:0 auto;padding:14px 18px 16px;display:flex;flex-direction:column;gap:clamp(8px,2dvh,18px)}
.flight{position:relative;height:clamp(58px,9.5dvh,84px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px 6px;background:var(--glass);border:1px solid var(--gb);border-radius:22px;overflow:hidden}
.flight .end{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.9rem;position:relative;z-index:2}
.flight .end span{font-size:1.5rem}
.flight svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.flight .trail{fill:none;stroke:url(#tg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 7}
.flight .gl{fill:none;stroke:var(--gb);stroke-width:1.5;stroke-dasharray:2 6}
.plane{position:absolute;left:0;top:0;font-size:1.5rem;line-height:1;will-change:transform;z-index:3;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.pin.pulse{animation:pp .8s ease-out}
@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.7) translateY(-4px)}100%{transform:scale(1)}}
.ring{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid var(--a);opacity:0;z-index:1}
.ring.go{animation:rg .9s ease-out}
@keyframes rg{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3.2)}}
.tag{align-self:flex-start;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--gb)}
.tag b{color:var(--c)}
h1{font-size:clamp(2.2rem,min(12vw,7dvh),3.6rem);line-height:.95;letter-spacing:-.04em;margin:0;font-weight:900}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.photos{position:relative;flex:1;min-height:0}
.ph{position:absolute;height:84%;aspect-ratio:1/1.08;border-radius:20px;overflow:hidden;border:3px solid var(--fg);box-shadow:0 18px 36px rgba(0,0,0,.35)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.p1{left:2%;top:0;transform:rotate(-6deg);animation:fl 6s ease-in-out infinite}
.p2{right:2%;bottom:0;transform:rotate(5deg);animation:fl 7s ease-in-out -2s infinite}
@keyframes fl{50%{translate:0 -6px}}
.heart{position:absolute;right:20%;top:-2%;font-size:clamp(1.7rem,5dvh,2.5rem);z-index:3;animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(255,61,129,.6))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--glass);border:1px solid var(--gb);border-radius:16px;padding:10px 2px 8px;text-align:center}
.cell b{display:block;font-size:clamp(1.4rem,4.4dvh,2rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.cell small{color:var(--muted);font-size:.64rem;text-transform:uppercase;letter-spacing:.1em}
.cell:first-child b{color:var(--a)}
.card{margin:0}
button{width:100%;font:inherit;font-weight:800;border:0;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));padding:12px 24px;border-radius:99px;cursor:pointer;box-shadow:0 10px 24px rgba(255,61,129,.35)}
button:active{transform:scale(.96)}
.fx{position:fixed;pointer-events:none;font-size:1.5rem;z-index:9;animation:up 2s ease-out forwards}
@keyframes up{0%{opacity:1;transform:translate(0,0) scale(.8)}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    <div class="plane" id="plane">✈️</div>

  <div class="count" id="count">
    <div class="cell"><b id="d">--</b><small>dní</small></div>
    <div class="cell"><b id="h">--</b><small>hodin</small></div>
    <div class="cell"><b id="m">--</b><small>minut</small></div>
    <div class="cell"><b id="s">--</b><small>sekund</small></div>
  </div>

  <div class="card"><button id="love">Klikni 🎉</button></div>
</main>

<script>
const target = new Date(2026, 11, 1, 0, 0, 0).getTime();
const $ = id => document.getElementById(id), pad = n => String(n).padStart(2,"0");
function tick(){
  const diff = target - Date.now();
  if (diff <= 0){
    $("count").innerHTML = '<div class="cell" style="grid-column:1/-1"><b style="font-size:1.5rem">JSEM TADY ❤️</b></div>';
    return;
  }
  const s = Math.floor(diff/1000);
  $("d").textContent = Math.floor(s/86400);
  $("h").textContent = pad(Math.floor(s%86400/3600));
  $("m").textContent = pad(Math.floor(s%3600/60));
  $("s").textContent = pad(s%60);
}
tick(); setInterval(tick,1000);

const flight=$("flight"),plane=$("plane"),trail=$("trail"),gl=$("gl"),pin=$("pin"),ring=$("ring"),svg=$("fsvg");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let geo=null, raf=0, timer=0;
function layout(){
  const f=flight.getBoundingClientRect(), a=$("from").getBoundingClientRect(), b=pin.getBoundingClientRect();
  const x0=a.left-f.left+a.width/2, y0=a.top-f.top+a.height/2;
  const x1=b.left-f.left+b.width/2, y1=b.top-f.top+b.height-2;
  const cx=(x0+x1)/2, cy=Math.min(y0,y1)-f.height*1.05;
  const d=`M${x0},${y0} Q${cx},${cy} ${x1},${y1}`;
  gl.setAttribute("d",d); trail.setAttribute("d",d);
  geo={x0,y0,x1,y1,cx,cy,len:trail.getTotalLength(),ringX:x1,ringY:y1};
  ring.style.left=(x1-7)+"px"; ring.style.top=(y1-7)+"px";
}
function at(p){
  const q=1-p;
  const x=q*q*geo.x0+2*q*p*geo.cx+p*p*geo.x1, y=q*q*geo.y0+2*q*p*geo.cy+p*p*geo.y1;
  const dx=2*q*(geo.cx-geo.x0)+2*p*(geo.x1-geo.cx), dy=2*q*(geo.cy-geo.y0)+2*p*(geo.y1-geo.cy);
  return {x,y,ang:Math.atan2(dy,dx)*180/Math.PI};
}
function place(p){
  const {x,y,ang}=at(p);
  plane.style.transform=`translate(${x-12}px,${y-12}px) rotate(${ang+45}deg) scale(${1+Math.sin(p*Math.PI)*.25})`;
  trail.style.strokeDasharray=`1 7`;
  trail.style.clipPath="none";
  trail.setAttribute("stroke-dashoffset",0);
  const L=geo.len*p;
  trail.style.maskImage=`linear-gradient(90deg,#000 ${p*100}%,transparent ${p*100}%)`;
  trail.style.webkitMaskImage=trail.style.maskImage;
}
function arrive(){
  pin.classList.remove("pulse"); ring.classList.remove("go"); void pin.offsetWidth;
  pin.classList.add("pulse"); ring.classList.add("go");
}
function fly(){
  cancelAnimationFrame(raf); clearTimeout(timer);
  if(!geo) layout();
  if(reduce){ place(1); return; }
  const dur=2800, t0=performance.now();
  plane.style.opacity=1;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    place(e);
    if(k<1){ raf=requestAnimationFrame(step); }
    else { arrive(); timer=setTimeout(()=>{ plane.style.opacity=0; setTimeout(()=>{place(0);plane.style.opacity=1;fly();},500); },2200); }
  })(t0);
}
addEventListener("resize",()=>{layout();place(1)});
requestAnimationFrame(()=>{layout();place(0);fly();});

$("love").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  const set = ["🍔","❤️","🎈","🍔","💖","🎈"];
  for (let k=0;k<18;k++){
    const f = document.createElement("div");
    f.className = "fx";
    f.textContent = set[k%set.length];
    f.style.left = (r.left + Math.random()*r.width) + "px";
    f.style.top = (r.top - 4) + "px";
    f.style.fontSize = (1.4 + Math.random()*1.2) + "rem";
    f.style.setProperty("--dx", (Math.random()*120-60) + "px");
    f.style.setProperty("--dy", -(180 + Math.random()*260) + "px");
    f.style.animationDelay = (Math.random()*.4)+"s";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),2400);
  }
});
</script>
